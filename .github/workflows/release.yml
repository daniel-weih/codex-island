name: Publish DMG

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish-dmg
  cancel-in-progress: false

jobs:
  release:
    if: github.event.deleted == false
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Select release tag
        run: |
          tag="${GITHUB_REF_NAME#release/}"
          [[ "$tag" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[1-9][0-9]*)?$ ]]
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check release version and architecture
        run: |
          python3 - <<'PY'
          import os, platform, plistlib, re
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d{4}\.\d{2}\.\d{2}(?:-[1-9]\d*)?', tag), 'Expected a vYYYY.MM.DD tag'
          with open('Packaging/Info.plist', 'rb') as stream:
              info = plistlib.load(stream)
          version = '.'.join(str(int(part)) for part in tag[1:].split('-')[0].split('.'))
          assert info['CFBundleShortVersionString'] == version, 'Tag and app version differ'
          assert platform.machine() == 'arm64', 'An Apple Silicon runner is required'
          PY

      - name: Test installer
        id: installer
        run: ./scripts/test-installer.sh 2>&1 | tee "$RUNNER_TEMP/installer-checks.log"

      - name: Build and verify DMG
        id: package
        run: ./scripts/package_dmg.sh 2>&1 | tee "$RUNNER_TEMP/package-dmg.log"

      - name: Upload, verify, and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/publish_release.sh 2>&1 | tee "$RUNNER_TEMP/publish.log"

      - name: Report failed checks
        if: failure()
        env:
          INSTALLER_OUTCOME: ${{ steps.installer.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          python3 - <<'PYDIAG'
          import os, pathlib
          for name, key in (('installer-checks', 'INSTALLER'), ('package-dmg', 'PACKAGE'), ('publish', 'PUBLISH')):
              if os.environ[f'{key}_OUTCOME'] != 'failure':
                  continue
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / f'{name}.log'
              if path.exists():
                  detail = path.read_text(errors='replace')[-6000:]
                  detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title={name}::{detail}')
          PYDIAG
