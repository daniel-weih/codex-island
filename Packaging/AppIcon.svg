<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Codex Island app icon</title>

  <!-- Full-bleed artwork prevents macOS from wrapping the icon in a legacy white tile. -->
  <rect width="1024" height="1024" fill="#050607"/>
  <rect x="22" y="22" width="980" height="980" rx="224"
        fill="none" stroke="#20252a" stroke-width="8"/>

  <!-- Expanded island: black surface with the product cyan as a restrained keyline. -->
  <rect x="250" y="246" width="524" height="520" rx="150"
        fill="#080a0c" stroke="#11b9d5" stroke-width="40"/>

  <!-- Physical notch / compact island. -->
  <rect x="318" y="330" width="388" height="144" rx="72"
        fill="#030506" stroke="#2a343a" stroke-width="10"/>

  <!-- Remaining-usage rail, matching the in-app status language. -->
  <rect x="330" y="628" width="364" height="38" rx="19" fill="#20272c"/>
  <rect x="330" y="628" width="235" height="38" rx="19" fill="#11b9d5"/>
</svg>
